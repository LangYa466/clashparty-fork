name: Update Scoop Manifest

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  update-scoop-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Update manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/scoop-update-manifest.mjs ${GITHUB_REF_NAME#v}
      - name: Commit and push
        run: |
          if git diff --quiet scoop/clash-party.json; then
            echo "No manifest change, skip commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scoop/clash-party.json
          git commit -m "chore(scoop): update manifest to v${GITHUB_REF_NAME#v}"
          git push
